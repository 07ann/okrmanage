<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>个人工作看板</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: 周看板（节奏条 + 统计 + 可收起的项目清单 + 四列）⇄ 日看板（🍎 计划/实际 + 今日清单 + 挑选区） */
:root {
  --bg: #e7ebee;
  --surface: #f4f6f8;
  --card: #ffffff;
  --ink: #1b2530;
  --muted: #5a6874;
  --line: #d1d8de;
  --accent: #2e4a98;
  --accent-soft: #e1e7f7;
  --wait: #a86d14;
  --wait-soft: #fbefd9;
  --alert: #c0443a;
  --alert-soft: #fae4e1;
  --ok: #2b7a57;
  --ok-soft: #dff1e8;
  --me: #7b4ea3;
  --me-soft: #efe5f8;
  --todo: #6d7a86;
  --apple: #d6453b;
  --shadow: 0 1px 2px rgba(27, 37, 48, .08), 0 3px 10px rgba(27, 37, 48, .05);
  --font-display: "Noto Serif SC", "Songti SC", "STSong", serif;
  --font-body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11171c; --surface: #182026; --card: #20292f; --ink: #e5eaee; --muted: #97a4af;
    --line: #303b44; --accent: #8fa7ee; --accent-soft: #232f4d; --wait: #e2a74b; --wait-soft: #382c19;
    --alert: #f07b6f; --alert-soft: #3b2220; --ok: #6cc69c; --ok-soft: #1b3228; --me: #c8a4ea; --me-soft: #322549;
    --todo: #8b98a4; --apple: #f0776c;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 3px 10px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11171c; --surface: #182026; --card: #20292f; --ink: #e5eaee; --muted: #97a4af;
  --line: #303b44; --accent: #8fa7ee; --accent-soft: #232f4d; --wait: #e2a74b; --wait-soft: #382c19;
  --alert: #f07b6f; --alert-soft: #3b2220; --ok: #6cc69c; --ok-soft: #1b3228; --me: #c8a4ea; --me-soft: #322549;
  --todo: #8b98a4; --apple: #f0776c;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 3px 10px rgba(0,0,0,.25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.55; }
.wrap {
  max-width: 1480px; margin: 0 auto;
  padding-block: 28px 110px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 18px;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: .5; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
svg { display: block; }

header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 20px; }
h1 { font-family: var(--font-display); font-size: 28px; margin: 0; letter-spacing: .02em; text-wrap: balance; }
.sub { color: var(--muted); margin: 4px 0 0; font-size: 13px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 7px 14px; border-radius: 6px; font-size: 13px; }
.btn:hover:not(:disabled) { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--card); font-weight: 500; }
.btn.danger { color: var(--alert); }
.btn.small { padding: 3px 10px; font-size: 12px; }
.link { background: none; border: 0; padding: 0; color: var(--accent); font-size: 13px; }

/* ---------- 🍎 ---------- */
.apples { display: inline-flex; flex-wrap: wrap; gap: 1px; line-height: 1; font-size: 16px; align-items: center; }
.apples i { font-style: normal; display: inline-block; }
.apples .a-empty { filter: grayscale(1); opacity: .28; }
.apples .a-part { opacity: .55; }
.apples .a-extra { filter: drop-shadow(0 0 2px var(--ok)); }
.apples .more { font-family: var(--font-mono); font-size: 12px; color: var(--muted); margin-left: 3px; }
.apples.lg { font-size: 22px; gap: 2px; }

/* ---------- 周节奏条 ---------- */
.weekbar { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: grid; gap: 12px; }
.weeknav { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.weeknav .range { font-family: var(--font-display); font-size: 19px; font-weight: 700; }
.weeknav .tag { font-size: 12px; color: var(--accent); background: var(--accent-soft); padding: 1px 8px; border-radius: 999px; }
.legend { margin-left: auto; display: flex; gap: 12px; font-size: 12px; color: var(--muted); align-items: center; }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
.days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.day { border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 8px 10px; text-align: left; display: grid; gap: 4px; min-width: 0; }
.day:hover { border-color: var(--accent); }
.day .dtop { display: flex; justify-content: space-between; align-items: baseline; gap: 4px; }
.day .dn { font-size: 12px; color: var(--muted); }
.day .dd { font-family: var(--font-mono); font-size: 15px; font-variant-numeric: tabular-nums; }
.day.today { border-color: var(--accent); background: var(--accent-soft); }
.day.today .dn { color: var(--accent); font-weight: 700; }
.minibars { height: 40px; display: flex; align-items: flex-end; gap: 4px; border-bottom: 1px solid var(--line); }
.minibars span { flex: 1; border-radius: 3px 3px 0 0; min-height: 2px; }
.minibars .b-done { background: var(--ok); }
.minibars .b-plan { background: var(--accent); }
.day.over { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.daysel { border: 1px dashed var(--line); background: var(--card); border-radius: 999px; font-size: 12px; padding: 0 6px; color: var(--muted); max-width: 100%; cursor: pointer; }
.daysel.set { border: 1px solid transparent; background: var(--accent-soft); color: var(--accent); font-weight: 500; }
.daysel.today { background: var(--accent); color: var(--card); }
.subi .daysel { font-size: 11px; }
.estctl { display: inline-flex; align-items: center; gap: 2px; }
.estctl button { width: 20px; height: 20px; border: 1px solid var(--line); background: var(--surface); border-radius: 4px; padding: 0; line-height: 1; font-size: 12px; }
.minibars .b-zero { background: var(--line); }
.day .dm { font-size: 11px; color: var(--muted); font-family: var(--font-mono); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 640px) { .day { padding: 6px; } .day .dm { display: none; } .minibars { height: 28px; gap: 2px; } }

/* ---------- 统计：矩阵 + 僵尸 ---------- */
.overview { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1.6fr); gap: 12px; align-items: stretch; }
@media (max-width: 900px) { .overview { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .overview .zcard { grid-column: 1 / -1; } }
@media (max-width: 480px) { .overview { grid-template-columns: minmax(0, 1fr); } }
.mcard { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.mlab { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.mlab b { font-weight: 700; color: var(--ink); font-size: 14px; display: inline-flex; align-items: center; gap: 6px; }
.mlab b i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.mbig { font-family: var(--font-mono); font-size: 30px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.mbig small { font-family: var(--font-body); font-size: 14px; font-weight: 400; color: var(--muted); }
.mx { display: grid; grid-template-columns: repeat(5, 20px); gap: 5px; }
.mx i { width: 20px; height: 20px; border-radius: 5px; border: 1.5px solid var(--line); display: block; }
.mx i.f-work { background: var(--accent); border-color: var(--accent); }
.mx i.f-me { background: var(--me); border-color: var(--me); }
.mx i.z-left { border-color: var(--alert); border-style: dashed; }
.mx i.z-do { background: var(--ok); border-color: var(--ok); }
.mx i.z-drop { background: var(--todo); border-color: var(--todo); }
.mx .more { font-family: var(--font-mono); font-size: 12px; color: var(--muted); grid-column: span 2; align-self: center; }
.zcard { border-color: color-mix(in srgb, var(--alert) 45%, var(--line)); }
.zbody { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px; align-items: start; }
@media (max-width: 480px) { .zbody { grid-template-columns: minmax(0, 1fr); } }
.zone { border: 1.5px solid var(--alert); border-radius: 10px; padding: 12px; display: grid; gap: 8px; background: var(--alert-soft); transition: transform .25s, opacity .25s; min-width: 0; }
.zone.out { transform: translateX(40px); opacity: 0; }
.zone .zt { font-weight: 700; font-size: 15px; overflow-wrap: anywhere; }
.zone .zage { font-family: var(--font-mono); color: var(--alert); font-weight: 700; }
.zacts { display: flex; flex-wrap: wrap; gap: 6px; }
.zacts button { border-radius: 7px; padding: 6px 12px; font-size: 13px; border: 1px solid var(--line); background: var(--card); }
.zacts .z-go { background: var(--ok); border-color: var(--ok); color: var(--card); font-weight: 500; }
.zacts .z-del { color: var(--alert); }
.zclear { font-size: 13px; color: var(--ok); padding: 10px 0; }
.sync { font-size: 12px; color: var(--muted); width: 100%; text-align: right; margin-top: -6px; cursor: pointer; }
.sync:hover { text-decoration: underline; }
.steps { margin: 0; padding-left: 20px; display: grid; gap: 6px; font-size: 13px; }
.steps a, .syncinfo a { color: var(--accent); }
.syncinfo { display: grid; gap: 4px; font-size: 13px; background: var(--surface); border-radius: 8px; padding: 10px 12px; }
.syncerr { font-size: 13px; color: var(--alert); }
#syncToken { flex: 1 1 200px; min-width: 0; border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 8px 10px; font-family: var(--font-mono); }
.sync.ok { color: var(--ok); }
.sync.error { color: var(--alert); }
.footline { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 12px; color: var(--muted); }
.footline b { font-family: var(--font-mono); color: var(--ink); }
.footline b.warn { color: var(--alert); }
.chip.stale { background: var(--wait-soft); color: var(--wait); }
.devline { font-size: 11px; color: var(--accent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* 月历 */
.modal.cal { width: min(900px, 100%); }
.calgrid { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 16px; }
@media (max-width: 760px) { .calgrid { grid-template-columns: minmax(0, 1fr); } }
.calhead { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.calhead .ym { font-family: var(--font-display); font-size: 18px; font-weight: 700; min-width: 110px; text-align: center; }
.calhead .spacer { flex: 1; }
.month { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.month .wd { font-size: 12px; color: var(--muted); text-align: center; padding: 2px 0; }
.mday { border: 1px solid var(--line); background: var(--surface); border-radius: 7px; min-height: 74px; padding: 4px 5px; text-align: left; display: grid; align-content: start; gap: 2px; min-width: 0; }
.mday:hover { border-color: var(--accent); }
.mday .n { font-family: var(--font-mono); font-size: 12px; font-variant-numeric: tabular-nums; }
.mday.other { opacity: .45; }
.mday.today .n { background: var(--accent); color: var(--card); border-radius: 4px; padding: 0 4px; justify-self: start; }
.mday.sel { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.mday .ev { font-size: 11px; color: var(--accent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mday .evm { font-size: 11px; color: var(--muted); }
@media (max-width: 520px) { .mday { min-height: 44px; } .mday .ev { display: none; } .mday.has::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); } }
.evpanel { display: grid; gap: 10px; align-content: start; background: var(--surface); border-radius: 10px; padding: 12px; }
.evpanel h4 { margin: 0; font-size: 15px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.evrow { display: flex; gap: 8px; align-items: baseline; background: var(--card); border: 1px solid var(--line); border-radius: 7px; padding: 6px 10px; font-size: 13px; }
.evrow .tm { font-family: var(--font-mono); color: var(--accent); flex: none; }
.evrow .tx { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.evrow .x { border: 0; background: none; color: var(--muted); font-size: 16px; line-height: 1; padding: 0; }
.evrow .x:hover { color: var(--alert); }
.evadd { display: flex; flex-wrap: wrap; gap: 6px; }
.evadd input[type="time"] { border: 1px solid var(--line); background: var(--card); border-radius: 6px; padding: 5px 6px; }
.evadd input[type="text"] { flex: 1 1 140px; min-width: 0; border: 1px solid var(--line); background: var(--card); border-radius: 6px; padding: 6px 9px; }
.dayev { display: flex; flex-wrap: wrap; gap: 6px; }
.dayev span { font-size: 12px; background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 2px 10px; }
.dayev b { font-family: var(--font-mono); font-weight: 500; margin-right: 4px; }
/* ---------- 统计 + 工作/个人（旧） ---------- */
.overview { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 12px; }
@media (max-width: 960px) { .overview { grid-template-columns: minmax(0, 1fr); } }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.stat { background: var(--card); padding: 12px 14px; display: grid; gap: 2px; align-content: start; }
.stat .k { font-size: 12px; color: var(--muted); }
.stat .v { font-family: var(--font-mono); font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.3; }
.stat .n { font-size: 11px; color: var(--muted); }
.stat.warn .v { color: var(--alert); }
.stat.good .v { color: var(--ok); }
@media (max-width: 560px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.balance { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; display: grid; gap: 10px; align-content: start; }
.balance h3 { margin: 0; font-size: 13px; font-weight: 700; display: flex; justify-content: space-between; gap: 8px; }
.balance h3 span { font-weight: 400; color: var(--muted); font-size: 12px; }
.crow { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 10px; align-items: center; }
.crow .lab { font-size: 13px; font-weight: 700; }
.crow .lab.me { color: var(--me); }
.crow .lab.work { color: var(--accent); }
.cbody { display: grid; gap: 4px; min-width: 0; }
.cbar { height: 12px; border-radius: 6px; background: var(--surface); border: 1px solid var(--line); overflow: hidden; }
.cbar i { display: block; height: 100%; border-radius: 6px; }
.cnums { display: flex; flex-wrap: wrap; gap: 2px 14px; font-size: 12px; color: var(--muted); }
.cnums b { font-family: var(--font-mono); color: var(--ink); font-size: 13px; font-variant-numeric: tabular-nums; }
.bnote { font-size: 12px; color: var(--muted); }
.bnote b { color: var(--me); }

.toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; background: var(--card); }
.seg button { border: 0; background: none; padding: 5px 14px; font-size: 13px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.notice { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; background: var(--accent-soft); border-radius: 8px; padding: 8px 14px; font-size: 13px; }

/* ---------- 看板 ---------- */
.board { display: grid; grid-template-columns: minmax(0, 1.35fr) repeat(4, minmax(0, 1fr)); gap: 12px; align-items: start; }
.board.pc-collapsed { grid-template-columns: 46px repeat(4, minmax(0, 1fr)); }
@media (max-width: 1240px) {
  .board, .board.pc-collapsed { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .board.pc-collapsed .col.projects { grid-column: 1 / -1; }
}
@media (max-width: 800px) { .board, .board.pc-collapsed { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 540px) { .board, .board.pc-collapsed { grid-template-columns: minmax(0, 1fr); } }
.col { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: grid; gap: 10px; min-height: 180px; align-content: start; min-width: 0; }
.col.over { border-color: var(--accent); background: var(--accent-soft); }
.col-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.col-head h2 { margin: 0; font-size: 15px; font-weight: 700; letter-spacing: .04em; display: flex; align-items: center; gap: 7px; }
.col-head h2 i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.pill { font-family: var(--font-mono); font-size: 12px; padding: 0 8px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); color: var(--muted); font-variant-numeric: tabular-nums; }
.col.full .pill { background: var(--alert); border-color: var(--alert); color: var(--card); }
.hint { font-size: 12px; color: var(--muted); margin-top: -6px; }
.slots { display: flex; gap: 5px; align-items: center; }
.slots span { flex: 1; height: 10px; border-radius: 3px; border: 1.5px dashed var(--line); }
.slots span.filled { border: 0; }
.slots span.f-work { background: var(--accent); }
.slots span.f-me { background: var(--me); }
.limitbtns { display: inline-flex; gap: 3px; }
.limitbtns button, .iconbtn { width: 24px; height: 24px; border: 1px solid var(--line); background: var(--card); border-radius: 5px; line-height: 1; padding: 0; font-size: 13px; display: inline-grid; place-items: center; }
.iconbtn:hover { border-color: var(--muted); }
.cards { display: grid; gap: 8px; }
.empty { font-size: 12px; color: var(--muted); border: 1px dashed var(--line); border-radius: 8px; padding: 14px; text-align: center; }

/* 收起的项目栏 */
.col.projects.collapsed { padding: 10px 0; min-height: 260px; justify-items: center; align-content: start; gap: 12px; background: var(--card); cursor: pointer; }
.col.projects.collapsed:hover { border-color: var(--accent); }
.vtitle { writing-mode: vertical-rl; letter-spacing: .3em; font-weight: 700; font-size: 14px; }
@media (max-width: 1240px) {
  .col.projects.collapsed { min-height: 0; grid-auto-flow: column; justify-content: start; align-items: center; padding: 10px 14px; }
  .vtitle { writing-mode: horizontal-tb; letter-spacing: .04em; }
}

.card { background: var(--card); border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px; box-shadow: var(--shadow); display: grid; gap: 6px; cursor: grab; min-width: 0; }
.card.dragging, .proj.dragging, .subi.dragging, .subrow.dragging { opacity: .4; }
.card .t { font-weight: 500; overflow-wrap: anywhere; cursor: pointer; display: flex; gap: 7px; align-items: baseline; }
.card .t:hover { color: var(--accent); }
.cdot { width: 8px; height: 8px; border-radius: 50%; flex: none; transform: translateY(-1px); }
.cdot.work { background: var(--accent); }
.cdot.me { background: var(--me); }
.meta { display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; font-size: 12px; }
.chip { padding: 1px 7px; border-radius: 999px; background: var(--bg); color: var(--muted); white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.chip.work { background: var(--accent-soft); color: var(--accent); }
.chip.me { background: var(--me-soft); color: var(--me); }
.chip.unplanned { background: var(--alert-soft); color: var(--alert); }
.chip.wait { background: var(--wait-soft); color: var(--wait); }
.chip.late { background: var(--alert); color: var(--card); }
.chip.zombie { background: var(--alert-soft); color: var(--alert); }
.chip.hard { background: var(--ink); color: var(--bg); }
.chip.easy { background: var(--ok); color: var(--card); font-weight: 500; }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.ex { border: 1px dashed var(--line); background: none; }
.age { margin-left: auto; font-family: var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.waitbar { height: 4px; border-radius: 2px; background: var(--wait-soft); overflow: hidden; }
.waitbar i { display: block; height: 100%; background: var(--wait); }
.waitbar.late i { background: var(--alert); }
.move { display: flex; gap: 4px; justify-content: flex-end; }
.move button { border: 1px solid var(--line); background: var(--surface); border-radius: 4px; font-size: 12px; padding: 1px 8px; color: var(--muted); }
.move button:hover { color: var(--ink); border-color: var(--muted); }

/* 项目卡 */
.col.projects { background: var(--card); }
.proj { border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: grid; gap: 10px; background: var(--surface); min-width: 0; position: relative; }
.proj.drop-before { box-shadow: 0 -3px 0 var(--accent); }
.proj.drop-after { box-shadow: 0 3px 0 var(--accent); }
.proj-top { display: flex; gap: 10px; align-items: center; }
.grip { cursor: grab; color: var(--muted); font-size: 13px; letter-spacing: -2px; user-select: none; padding: 2px; }
.ringbox { position: relative; flex: none; }
.ringbox .pct { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--font-mono); font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }
.proj-name { display: grid; gap: 4px; min-width: 0; flex: 1; }
.proj-name .t { font-weight: 700; font-size: 15px; overflow-wrap: anywhere; cursor: pointer; background: none; border: 0; padding: 0; text-align: left; }
.proj-name .t:hover { color: var(--accent); }
.segbar { display: flex; gap: 3px; }
.segbar span { flex: 1; height: 7px; border-radius: 2px; background: var(--line); }
.segbar span.s-done { background: var(--ok); }
.segbar span.s-active { background: var(--accent); }
.segbar span.s-wait { background: var(--wait); }
.subl { display: grid; gap: 1px; }
.subi { display: flex; align-items: center; gap: 7px; font-size: 13px; padding: 3px 2px; border-radius: 5px; }
.subi .grip { font-size: 11px; opacity: .5; }
.subi:hover .grip { opacity: 1; }
.subi.drop-before { box-shadow: 0 -2px 0 var(--accent); }
.subi.drop-after { box-shadow: 0 2px 0 var(--accent); }
.subi input { accent-color: var(--ok); width: 15px; height: 15px; flex: none; margin: 0; }
.subi label { flex: 1; min-width: 0; overflow-wrap: anywhere; cursor: pointer; }
.subi.isdone label { text-decoration: line-through; color: var(--muted); }
.subi .chip { font-size: 11px; }
.proj-foot { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--muted); align-items: center; }
.proj-foot .link { font-size: 12px; margin-left: auto; }

/* ---------- 日看板 ---------- */
.dayhead { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
.dayhead h1 { font-size: 26px; }
.timebox { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 18px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px 24px; align-items: center; }
@media (max-width: 720px) { .timebox { grid-template-columns: minmax(0, 1fr); } }
.trow { display: grid; grid-template-columns: 42px minmax(0, 1fr) auto; gap: 10px; align-items: center; }
.trow .lab { font-size: 13px; color: var(--muted); font-weight: 500; }
.trow .num { font-family: var(--font-mono); font-size: 13px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.trow .num b { color: var(--ink); font-size: 16px; }
.tlines { display: grid; gap: 8px; min-width: 0; }
.compare { height: 8px; border-radius: 4px; background: var(--surface); border: 1px solid var(--line); overflow: hidden; }
.compare i { display: block; height: 100%; background: var(--apple); border-radius: 4px; transition: width .4s; }
.tside { display: flex; gap: 22px; }
.tside div { display: grid; text-align: center; }
.tside b { font-family: var(--font-mono); font-size: 24px; font-variant-numeric: tabular-nums; line-height: 1.2; }
.tside span { font-size: 12px; color: var(--muted); }
.unit { font-size: 12px; color: var(--muted); }

.daygrid { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 900px) { .daygrid { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
.panel h2 { margin: 0; font-size: 16px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.panel h2 small { font-weight: 400; font-size: 12px; color: var(--muted); }
.panel .hint { margin-top: -8px; }
.plan { display: grid; gap: 8px; }

.item { background: var(--card); border: 1px solid var(--line); border-radius: 11px; padding: 11px 13px; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px 12px; align-items: start; box-shadow: var(--shadow); position: relative; }
.item.easy { border-color: var(--ok); }
.item.running { border-color: var(--apple); box-shadow: 0 0 0 3px color-mix(in srgb, var(--apple) 18%, transparent); }
.item.isdone { box-shadow: none; background: var(--surface); }
.item.isdone .t { text-decoration: line-through; color: var(--muted); }
.item > input[type="checkbox"] { margin-top: 3px; width: 18px; height: 18px; accent-color: var(--ok); }
.item .body { display: grid; gap: 6px; min-width: 0; }
.item .t { font-weight: 500; overflow-wrap: anywhere; cursor: pointer; }
.item .x { border: 0; background: none; color: var(--muted); font-size: 18px; line-height: 1; padding: 0 2px; }
.item .x:hover { color: var(--alert); }
.ifoot { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.ifoot .spacer { flex: 1; }
.abtn { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; font-size: 12px; padding: 2px 9px; }
.abtn:hover:not(:disabled) { border-color: var(--muted); }
.abtn.go { background: var(--apple); border-color: var(--apple); color: var(--card); font-weight: 500; }
.abtn.stop { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.hardbox { display: flex; gap: 12px; align-items: center; background: var(--surface); border-radius: 9px; padding: 8px 10px; }
.bigring { position: relative; flex: none; }
.bigring .center { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; line-height: 1.05; }
.bigring .center b { font-family: var(--font-mono); font-size: 20px; font-variant-numeric: tabular-nums; display: block; }
.bigring .center span { font-size: 10px; color: var(--muted); }
.bigring .center .tleft { font-size: 13px; font-weight: 700; color: var(--apple); }
.dots { display: flex; flex-wrap: wrap; gap: 3px; }
.dots i { width: 10px; height: 10px; border-radius: 3px; background: var(--accent); }
.dots i.short { background: var(--accent-soft); box-shadow: inset 0 0 0 1.5px var(--accent); }
.dots i.today { outline: 1.5px solid var(--ink); outline-offset: 1px; }
.tleft { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.tring-fg { transition: stroke-dashoffset 1s linear; }

/* 挑选区 */
.picker { background: var(--card); }
.pgroup { display: grid; gap: 6px; }
.pgroup h3 { margin: 4px 0 0; font-size: 12px; color: var(--muted); font-weight: 500; letter-spacing: .04em; }
.pick { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 8px 11px; transition: transform .15s ease, border-color .15s, box-shadow .15s; }
.pick:hover { transform: translateY(-1px); border-color: var(--accent); box-shadow: var(--shadow); }
.pick .pt { overflow-wrap: anywhere; font-size: 13px; }
.pick .plus { font-size: 12px; color: var(--accent); font-weight: 500; white-space: nowrap; }
.pick .meta { grid-column: 1 / -1; }
.pick.easy { border: 1.5px solid var(--ok); background: linear-gradient(105deg, var(--ok-soft) 0%, var(--ok-soft) 42%, var(--card) 50%, var(--ok-soft) 58%, var(--ok-soft) 100%); background-size: 260% 100%; animation: shine 3.2s ease-in-out infinite; }
.pick.easy .plus { color: var(--ok); }
.pick.easy:hover { transform: translateY(-2px) scale(1.02); box-shadow: 0 6px 16px color-mix(in srgb, var(--ok) 25%, transparent); }
.pick.easy .zap { display: inline-block; animation: bob 1.6s ease-in-out infinite; }
.pick.leaving { animation: leave .24s ease-in forwards; }
.item.arrive { animation: arrive .45s cubic-bezier(.2, 1.4, .4, 1); }
@keyframes shine { 0%, 100% { background-position: 100% 0; } 50% { background-position: 0 0; } }
@keyframes bob { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-3px) rotate(-8deg); } }
@keyframes leave { to { transform: translateX(-24px) scale(.9); opacity: 0; } }
@keyframes arrive { 0% { transform: scale(.85); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
.particle { position: fixed; width: 8px; height: 8px; border-radius: 2px; pointer-events: none; z-index: 40; animation: fly .75s cubic-bezier(.15, .7, .3, 1) forwards; }
@keyframes fly { to { transform: translate(var(--dx), var(--dy)) rotate(var(--r)) scale(.3); opacity: 0; } }
.quick { display: flex; flex-wrap: wrap; gap: 6px; }
.quick input[type="text"] { flex: 1 1 180px; min-width: 0; border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 7px 10px; }
.quick select { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 6px 8px; }

/* ---------- 弹窗 ---------- */
.overlay { position: fixed; inset: 0; background: rgba(10, 16, 22, .45); display: grid; place-items: center; padding: 16px; z-index: 20; }
.modal { background: var(--card); border-radius: 12px; width: min(520px, 100%); max-height: 90vh; overflow: auto; padding: 20px; display: grid; gap: 14px; box-shadow: 0 10px 40px rgba(0,0,0,.25); }
.modal h3 { margin: 0; font-family: var(--font-display); font-size: 18px; }
.field { display: grid; gap: 5px; }
.field > span { font-size: 12px; color: var(--muted); letter-spacing: .03em; }
.field input:not([type="radio"]):not([type="checkbox"]), .field textarea, .field select { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 8px 10px; }
.field textarea { min-height: 64px; resize: vertical; }
.row2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
@media (max-width: 440px) { .row2 { grid-template-columns: minmax(0, 1fr); } }
.radios { display: flex; flex-wrap: wrap; gap: 14px; }
.radios label { display: inline-flex; align-items: center; gap: 6px; }
.modal-foot { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; align-items: center; }
.modal-foot .spacer { flex: 1; }
.saved { font-size: 12px; color: var(--ok); }
.subs { display: grid; gap: 6px; }
.subrow { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 7px; padding: 6px 10px; background: var(--surface); }
.subrow.drop-before { box-shadow: 0 -2px 0 var(--accent); }
.subrow.drop-after { box-shadow: 0 2px 0 var(--accent); }
.subrow input[type="checkbox"] { accent-color: var(--ok); width: 15px; height: 15px; flex: none; }
.subrow .st { flex: 1; min-width: 0; overflow-wrap: anywhere; font-size: 13px; }
.subrow.isdone .st { text-decoration: line-through; color: var(--muted); }
.subrow .x { border: 0; background: none; color: var(--muted); font-size: 16px; line-height: 1; padding: 0 2px; }
.subrow .x:hover { color: var(--alert); }
#ioText { min-height: 180px; font-family: var(--font-mono); font-size: 12px; }

.timerbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 15;
  background: var(--ink); color: var(--bg);
  padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px 18px;
}
.timerbar .tt { min-width: 0; overflow-wrap: anywhere; font-size: 13px; opacity: .85; }
.timerbar .tleft { font-size: 22px; font-weight: 700; }
.timerbar button { border: 1px solid var(--bg); background: none; color: var(--bg); border-radius: 6px; padding: 4px 12px; font-size: 13px; }
.toast { position: fixed; left: 50%; top: calc(16px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 8px; font-size: 13px; z-index: 30; max-width: calc(100% - 32px); box-shadow: 0 4px 16px rgba(0,0,0,.2); }
.guide { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 18px; }
.guide b { color: var(--ink); font-weight: 500; }
/* ---------- 手机端 ---------- */
.mtabs { display: none; }
@media (max-width: 640px) {
  .wrap { gap: 14px; padding-block: 16px 120px; }
  h1 { font-size: 22px; }
  header { align-items: center; }
  header .actions { gap: 6px; }
  header .btn { padding: 6px 10px; }
  .sync { text-align: left; margin-top: 0; }
  .weekbar { padding: 10px; gap: 10px; border-radius: 10px; }
  .weeknav { gap: 6px 10px; }
  .weeknav .range { font-size: 16px; }
  .legend { display: none; }
  .days { gap: 4px; }
  .day { padding: 6px 4px; text-align: center; }
  .day .dtop { flex-direction: column; align-items: center; gap: 0; }
  .day .dn { font-size: 11px; }
  .day .dd { font-size: 13px; }
  .devline { display: none; }
  .overview { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
  .overview .zcard { grid-column: 1 / -1; }
  .mcard { padding: 12px; gap: 8px; }
  .mbig { font-size: 24px; }
  .mx { grid-template-columns: repeat(5, 16px); gap: 4px; }
  .mx i { width: 16px; height: 16px; border-radius: 4px; }
  .zbody { grid-template-columns: minmax(0, 1fr); gap: 10px; }
  .toolbar { flex-direction: column; align-items: stretch; }
  .seg { align-self: flex-start; }
  /* 看板：一次看一列，用标签切换 */
  .mtabs { display: flex; gap: 4px; overflow-x: auto; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 6px; margin-block: -6px; scrollbar-width: none; }
  .mtabs::-webkit-scrollbar { display: none; }
  .mtabs button { flex: 1 0 auto; border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 12px; font-size: 13px; color: var(--muted); white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; }
  .mtabs button i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .mtabs button b { font-family: var(--font-mono); font-weight: 500; font-size: 12px; }
  .mtabs button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
  .board, .board.pc-collapsed { grid-template-columns: minmax(0, 1fr); }
  .board .col:not(.mactive) { display: none; }
  .board .col { min-height: 120px; }
  .board .col.projects .iconbtn[aria-label="收起项目清单"] { display: none; }
  /* 日看板 */
  .dayhead { gap: 8px; }
  .dayhead h1 { font-size: 20px; width: 100%; order: 2; }
  .dayhead > .btn { order: 1; }
  .dayhead > .chip, .dayhead > .link { order: 3; }
  .dayhead .actions { margin-left: 0 !important; order: 4; width: 100%; }
  .timebox { padding: 12px; gap: 10px; }
  .trow { grid-template-columns: 36px minmax(0, 1fr); row-gap: 2px; }
  .trow .num { grid-column: 2; }
  .apples.lg { font-size: 18px; }
  .tside { justify-content: space-around; }
  .panel { padding: 12px; }
  .item { padding: 10px; gap: 8px 10px; }
  .ifoot { gap: 6px 8px; }
  .hardbox { padding: 6px 8px; }
  .quick select { flex: 1 1 auto; }
  /* 弹窗改为底部抽屉 */
  .overlay { place-items: end center; padding: 0; }
  .modal, .modal.cal { width: 100%; max-height: 92vh; border-radius: 16px 16px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom, 0px)); }
  .month { gap: 2px; }
  .mday { padding: 3px; border-radius: 6px; }
  /* 输入框 16px，避免 iPhone 自动放大 */
  input[type="text"], input[type="password"], input[type="time"], input[type="date"], input:not([type]), textarea { font-size: 16px !important; }
  .timerbar .tleft { font-size: 18px; }
}
/* 触屏：加大点按区域 */
@media (pointer: coarse) {
  .abtn, .move button, .zacts button { min-height: 34px; }
  .limitbtns button, .iconbtn, .estctl button { min-width: 32px; min-height: 32px; }
  .item > input[type="checkbox"] { width: 22px; height: 22px; }
  .subi input, .subrow input[type="checkbox"] { width: 20px; height: 20px; }
  .subi { padding-block: 6px; }
  .item .x, .evrow .x, .subrow .x { min-width: 32px; min-height: 32px; }
  .daysel { min-height: 28px; }
  .grip { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<!-- 任务弹窗 -->
<div class="overlay" id="cardOverlay" hidden>
  <form class="modal" id="cardForm" autocomplete="off">
    <h3 id="cardTitle">新建任务</h3>
    <label class="field"><span>任务</span><textarea id="fTitle" required placeholder="写下一步动作，比如：列 5 个选题标题"></textarea></label>
    <div class="row2">
      <div class="field"><span>分类</span>
        <div class="radios">
          <label><input type="radio" name="fCat" id="fCatWork" value="工作" checked> 工作</label>
          <label><input type="radio" name="fCat" id="fCatMe" value="个人"> 个人</label>
        </div>
      </div>
      <div class="field"><span>来源</span>
        <div class="radios">
          <label><input type="radio" name="fType" id="fTypePlan" value="plan" checked> 计划内</label>
          <label><input type="radio" name="fType" id="fTypeUn" value="unplanned"> 插单</label>
        </div>
      </div>
    </div>
    <div class="field"><span>难度</span>
      <div class="radios">
        <label><input type="radio" name="fDiff" id="fDiffEasy" value="easy"> ⚡ 简单</label>
        <label><input type="radio" name="fDiff" id="fDiffNormal" value="normal" checked> 普通</label>
        <label><input type="radio" name="fDiff" id="fDiffHard" value="hard"> 困难重要（反复启动）</label>
      </div>
    </div>
    <div class="row2">
      <label class="field"><span>所属项目</span><select id="fProj"></select></label>
    </div>
    <label class="field"><span>所在列</span>
      <select id="fCol">
        <option value="todo">待办</option>
        <option value="doing">进行中</option>
        <option value="wait">等待中</option>
        <option value="done">完成</option>
      </select>
    </label>
    <label class="field" id="fWaitWrap"><span>在等谁 / 等什么</span><input id="fWait" placeholder="比如：领导审批、设计出图"></label>
    <div class="modal-foot">
      <button type="button" class="btn danger" id="cardDel" hidden>删除</button>
      <span class="spacer"></span>
      <button type="button" class="btn" id="cardCancel">取消</button>
      <button type="submit" class="btn primary">保存</button>
    </div>
  </form>
</div>

<!-- 项目弹窗 -->
<div class="overlay" id="projOverlay" hidden>
  <form class="modal" id="projForm" autocomplete="off">
    <h3 id="projTitle">新建项目</h3>
    <label class="field"><span>项目名称</span><input id="pName" required placeholder="比如：个人公众号"></label>
    <div class="field"><span>分类</span>
      <div class="radios">
        <label><input type="radio" name="pCat" id="pCatWork" value="工作" checked> 工作</label>
        <label><input type="radio" name="pCat" id="pCatMe" value="个人"> 个人</label>
      </div>
    </div>
    <label class="field"><span>目标 / 说明（可选）</span><textarea id="pNote" placeholder="比如：年底前发出 4 篇"></textarea></label>
    <div class="field"><span>子项目</span>
      <div class="subs" id="pSubs"></div>
      <div class="quick">
        <input type="text" id="pSubInput" placeholder="添加子项目，回车确认">
        <button type="button" class="btn small" id="pSubAdd">添加</button>
      </div>
    </div>
    <div class="modal-foot">
      <button type="button" class="btn danger" id="projDel" hidden>删除项目</button>
      <span class="spacer"></span>
      <span class="saved" id="projSaved" hidden>已保存</span>
      <button type="button" class="btn" id="projCancel">关闭</button>
      <button type="submit" class="btn primary">保存</button>
    </div>
  </form>
</div>

<!-- 等待弹窗 -->
<div class="overlay" id="waitOverlay" hidden>
  <form class="modal" id="waitForm" autocomplete="off">
    <h3>移到等待中</h3>
    <p class="sub" style="margin:0">写清楚在等谁，每周回顾时才知道该催谁。</p>
    <label class="field"><span>在等谁 / 等什么</span><input id="wWait" required placeholder="比如：业务部门提供客户资料"></label>
    <div class="modal-foot">
      <button type="button" class="btn" id="wCancel">取消</button>
      <button type="submit" class="btn primary">确定</button>
    </div>
  </form>

  /* ---------- OKR 联动 ----------

        h('div', { class: 'ifoot' }, [
          appleRow(c.est, earned, { label: c.title + '：' }),
          h('span', { class: 'estctl', title: '调整计划的 ' + APPLE + ' 数' }, [
            h('button', { type: 'button', 'aria-label': '计划减少一个', text: '−', onclick: function () { if (c.est > 1) { c.est--; save(); render(); } } }),
            h('span', { class: 'unit', text: (Math.round(earned * 10) / 10) + '/' + c.est }),
            h('button', { type: 'button', 'aria-label': '计划增加一个', text: '+', onclick: function () { if (c.est < 12) { c.est++; save(); render(); } } })
          ]),
          h('span', { class: 'spacer' }),
          timerBtn,
          !isDone ? h('button', { type: 'button', class: 'abtn', title: '补记 20 分钟', text: '+' + APPLE, onclick: function () { addManualApple(c, dayStr); } }) : null,
          hasManual ? h('button', { type: 'button', class: 'abtn', title: '撤回一个补记', text: '−' + APPLE, onclick: function () { removeManualApple(c, dayStr); } }) : null
        ])
      ]),
      h('button', { type: 'button', class: 'x', title: '移出这一天', 'aria-label': '把“' + c.title + '”移出这一天',
        text: '×', onclick: function () { removeFromPlan(dayStr, c.id); save(); render(); } })
    ]);
  }

  function quickAdd() {
    var inp = h('input', { type: 'text', id: 'qa-in', placeholder: '新任务：直接写，回车放进这一天' });
    var cat = h('select', { id: 'qa-cat', 'aria-label': '分类' }, [h('option', { value: '工作', text: '工作' }), h('option', { value: '个人', text: '个人' })]);
    if (state.filter !== 'all') cat.value = state.filter;
    var diff = h('select', { id: 'qa-diff', 'aria-label': '难度' }, [h('option', { value: 'easy', text: '⚡ 简单' }), h('option', { value: 'normal', text: '普通' }), h('option', { value: 'hard', text: '困难重要' })]);
    diff.value = 'normal';
    function add() {
      var v = inp.value.trim(); if (!v) { inp.focus(); return; }
      var t = Date.now(), id = uid();
      state.cards.push({ id: id, title: v, cat: cat.value, type: 'plan', diff: diff.value, est: DEF_EST[diff.value], col: 'todo', created: t, moved: t, sessions: [] });
      addToPlan(dayStr, id); arrivedId = id;
      save(); render(); toast('已放进这一天');
      var again = $('qa-in'); if (again) again.focus();
    }
    inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); add(); } });
    return h('div', { class: 'quick' }, [inp, cat, diff, h('button', { class: 'btn small', type: 'button', text: '添加', onclick: add })]);
  }

  function render() {
    var app = $('app'); app.textContent = '';
    if (view === 'week') renderWeek(app); else renderDay(app);
    renderTimerBar();
  }

  /* ---------- card modal ---------- */
  var editing = null;
  function syncWait() { $('fWaitWrap').hidden = $('fCol').value !== 'wait'; }
  function diffVal() { return $('fDiffEasy').checked ? 'easy' : $('fDiffHard').checked ? 'hard' : 'normal'; }
  function openCard(id) {
    editing = id || null;
    var c = id ? find(id) : null;
    $('cardTitle').textContent = c ? '编辑任务' : '新建任务';
    $('fTitle').value = c ? c.title : '';
    var cat = c ? c.cat : (state.filter !== 'all' ? state.filter : '工作');
    (cat === '个人' ? $('fCatMe') : $('fCatWork')).checked = true;
    (c && c.type === 'unplanned' ? $('fTypeUn') : $('fTypePlan')).checked = true;
    var dv = c ? c.diff : 'normal';
    $(dv === 'easy' ? 'fDiffEasy' : dv === 'hard' ? 'fDiffHard' : 'fDiffNormal').checked = true;
    var sel = $('fProj'); sel.textContent = '';
    sel.appendChild(h('option', { value: '', text: '不属于任何项目' }));
    state.projects.forEach(function (p) { sel.appendChild(h('option', { value: p.id, text: p.name + '（' + p.cat + '）' })); });
    sel.value = c ? (c.projectId || '') : '';
    $('fCol').value = c ? c.col : 'todo';
    $('fWait').value = c ? (c.waitFor || '') : '';
    var del = $('cardDel'); del.hidden = !c; del.dataset.confirm = ''; del.textContent = '删除';
    syncWait();
    $('cardOverlay').hidden = false; $('fTitle').focus();
  }
  function closeCard() { $('cardOverlay').hidden = true; editing = null; }
  $('fCol').addEventListener('change', syncWait);
  $('fProj').addEventListener('change', function () { var p = findProj(this.value); if (p) (p.cat === '个人' ? $('fCatMe') : $('fCatWork')).checked = true; });
  $('cardForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var title = $('fTitle').value.trim(); if (!title) return;
    var col = $('fCol').value, c = editing ? find(editing) : null;
    var othersDoing = inCol('doing').filter(function (x) { return !c || x.id !== c.id; }).length;
    if (col === 'doing' && (!c || c.col !== 'doing') && othersDoing >= state.limit) { toast('进行中已满，先放进待办吧'); return; }
    if (col === 'wait' && !$('fWait').value.trim()) { toast('写一下在等谁'); $('fWait').focus(); return; }
    var t = Date.now();
    if (!c) { c = { id: uid(), created: t, moved: t, sessions: [] }; state.cards.push(c); }
    if (c.col !== col) { c.moved = t; if (col === 'wait') c.waitSince = t; if (col === 'done') c.doneAt = t; }
    var newProj = $('fProj').value || null;
    if (c.subId && newProj !== c.projectId) { var os = findSub(c); if (os) delete os.cardId; delete c.subId; }
    c.title = title; c.col = col;
    c.cat = $('fCatMe').checked ? '个人' : '工作';
    c.type = $('fTypeUn').checked ? 'unplanned' : 'plan';
    var nd = diffVal(); if (!c.est || nd !== c.diff) c.est = DEF_EST[nd]; c.diff = nd;
    c.projectId = newProj;
    c.waitFor = $('fWait').value.trim();
    if (col !== 'done') delete c.doneAt;
    if (col !== 'wait') delete c.waitSince;
    if (col === 'done' && state.timer && state.timer.cardId === c.id) finishTimer(false);
    var s = findSub(c); if (s) { s.title = title; s.done = col === 'done'; }
    c.touched = Date.now();
    save(); closeCard(); render(); toast('已保存');
  });
  $('cardCancel').addEventListener('click', closeCard);
  $('cardDel').addEventListener('click', function () {
    if (!editing) return;
    var b = this;
    if (b.dataset.confirm !== '1') { b.dataset.confirm = '1'; b.textContent = '再点一次确认删除'; return; }
    var c = find(editing);
    if (c) { var s = findSub(c); if (s) delete s.cardId; }
    if (state.timer && state.timer.cardId === editing) state.timer = null;
    Object.keys(state.plans).forEach(function (k) { removeFromPlan(k, editing); });
    state.cards = state.cards.filter(function (x) { return x.id !== editing; });
    save(); closeCard(); render(); toast('已删除');
  });

  /* ---------- project modal ---------- */
  var pCur = null, pIsNew = false, savedTimer;
  function flashSaved() { var s = $('projSaved'); s.hidden = false; clearTimeout(savedTimer); savedTimer = setTimeout(function () { s.hidden = true; }, 1500); }
  function persistSubs() { if (!pIsNew) { save(); render(); flashSaved(); } }
  function openProject(id) {
    var p = id ? findProj(id) : null;
    pIsNew = !p;
    pCur = p || { id: uid(), name: '', cat: state.filter === '个人' ? '个人' : '工作', note: '', subs: [], created: Date.now() };
    $('projTitle').textContent = p ? '编辑项目' : '新建项目';
    $('pName').value = pCur.name;
    (pCur.cat === '个人' ? $('pCatMe') : $('pCatWork')).checked = true;
    $('pNote').value = pCur.note || '';
    $('pSubInput').value = '';
    $('projSaved').hidden = true;
    var del = $('projDel'); del.hidden = !p; del.dataset.confirm = ''; del.textContent = '删除项目';
    renderSubs();
    $('projOverlay').hidden = false; $('pName').focus();
  }
  function renderSubs() {
    var box = $('pSubs'); box.textContent = '';
    if (!pCur.subs.length) box.appendChild(h('div', { class: 'empty', text: '还没有子项目，在下面添加' }));
    pCur.subs.forEach(function (s, i) {
      var c = s.cardId && find(s.cardId);
      var row = h('div', { class: 'subrow' + (s.done ? ' isdone' : '') }, [
        h('span', { class: 'grip', title: '拖动排序', text: '⋮⋮' }),
        h('input', { type: 'checkbox', id: 'sub-' + s.id, checked: s.done ? true : null, 'aria-label': '完成 ' + s.title,
          onchange: function (e) { setSubDone(pCur, s, e.target.checked); renderSubs(); persistSubs(); } }),
        h('span', { class: 'st', text: s.title }),
        c && !s.done ? h('span', { class: 'chip' + (c.col === 'wait' ? ' wait' : c.col === 'doing' ? ' work' : ''), text: COLNAME[c.col] }) : null,
        !s.done && !c ? h('button', { type: 'button', class: 'btn small', text: '→ 待办', title: '变成一张任务卡', onclick: function () { subToCard(s); } }) : null,
        h('button', { type: 'button', class: 'x', text: '×', 'aria-label': '删除子项目', onclick: function () {
          if (c) delete c.subId;
          pCur.subs.splice(i, 1); renderSubs(); persistSubs(); } })
      ]);
      makeSortable(row, 'msub', s.id, function (src, after) { reorder(pCur.subs, src, s.id, after); renderSubs(); persistSubs(); });
      box.appendChild(row);
    });
  }
  function addSub() {
    var v = $('pSubInput').value.trim(); if (!v) return;
    pCur.subs.push({ id: uid(), title: v, done: false });
    $('pSubInput').value = ''; renderSubs(); persistSubs(); $('pSubInput').focus();
  }
  function commitProject() {
    var name = $('pName').value.trim();
    if (!name) { toast('先写项目名称'); $('pName').focus(); return false; }
    pCur.name = name; pCur.cat = $('pCatMe').checked ? '个人' : '工作'; pCur.note = $('pNote').value.trim();
    if (pIsNew) { state.projects.push(pCur); pIsNew = false; $('projTitle').textContent = '编辑项目'; $('projDel').hidden = false; }
    return true;
  }
  function subToCard(s) {
    if (!commitProject()) return;
    var t = Date.now(), id = uid();
    state.cards.push({ id: id, title: s.title, cat: pCur.cat, type: 'plan', diff: 'normal', est: 2, projectId: pCur.id, subId: s.id, col: 'todo', created: t, moved: t, sessions: [] });
    s.cardId = id;
    save(); render(); renderSubs(); flashSaved();
    toast('“' + s.title + '”已放进待办');
  }
  $('pSubAdd').addEventListener('click', addSub);
  $('pSubInput').addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); addSub(); } });
  $('projForm').addEventListener('submit', function (e) {
    e.preventDefault();
    if ($('pSubInput').value.trim()) addSub();
    if (!commitProject()) return;
    save(); $('projOverlay').hidden = true; pCur = null; render(); toast('项目已保存');
  });
  $('projCancel').addEventListener('click', function () { $('projOverlay').hidden = true; pCur = null; render(); });
  $('projDel').addEventListener('click', function () {
    var b = this;
    if (b.dataset.confirm !== '1') { b.dataset.confirm = '1'; b.textContent = '再点一次确认（任务卡会保留）'; return; }
    var id = pCur.id;
    state.projects = state.projects.filter(function (p) { return p.id !== id; });
    state.cards.forEach(function (c) { if (c.projectId === id) { c.projectId = null; delete c.subId; } });
    save(); $('projOverlay').hidden = true; pCur = null; render(); toast('项目已删除');
  });

  /* ---------- wait modal ---------- */
  function closeWait() { $('waitOverlay').hidden = true; pendingWait = null; }
  $('waitForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var c = find(pendingWait), v = $('wWait').value.trim();
    if (!c || !v) return;
    c.waitFor = v; closeWait(); applyMove(c, 'wait');
  });
  $('wCancel').addEventListener('click', closeWait);

  /* ---------- backup ---------- */
  function openIO() { $('ioText').value = JSON.stringify(state, null, 1); var cb = $('ioClear'); cb.dataset.confirm = ''; cb.textContent = '清空看板数据'; $('ioOverlay').hidden = false; }
  $('ioDownload').addEventListener('click', function () {
    try {
      var blob = new Blob([JSON.stringify(state, null, 1)], { type: 'application/json' });
      var a = document.createElement('a'); a.href = URL.createObjectURL(blob);
      a.download = '个人看板备份-' + ymd(Date.now()) + '.json';
      document.body.appendChild(a); a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
      toast('备份文件已下载');
    } catch (e) { toast('这里没法下载，请用“复制”'); }
  });
  $('ioClear').addEventListener('click', function () {
    var b = this;
    if (b.dataset.confirm !== '1') { b.dataset.confirm = '1'; b.textContent = '再点一次，确认清空'; return; }
    b.dataset.confirm = ''; b.textContent = '清空看板数据';
    state = { limit: state.limit, filter: 'all', sample: false, timer: null, projCollapsed: state.projCollapsed, plans: {}, events: {}, zlog: [], projects: [], cards: [] };
    save(); render(); $('ioOverlay').hidden = true; toast('看板数据已清空');
  });
  $('ioClose').addEventListener('click', function () { $('ioOverlay').hidden = true; });
  $('ioCopy').addEventListener('click', function () {
    var ta = $('ioText');
    function fallback() { ta.focus(); ta.select(); toast('已选中，按 Ctrl/⌘ + C 复制'); }
    try { navigator.clipboard.writeText(ta.value).then(function () { toast('已复制，存到备忘录里就好'); }, fallback); }
    catch (e) { fallback(); }
  });
  $('ioImport').addEventListener('click', function () {
    try {
      var s = normalize(JSON.parse($('ioText').value));
      if (!s) throw new Error();
      state = s; save(); render(); $('ioOverlay').hidden = true; toast('导入成功');
    } catch (e) { toast('内容格式不对，请粘贴完整的备份'); }
  });

  function clearSample() {
    state = { limit: state.limit, filter: 'all', sample: false, timer: null, projCollapsed: state.projCollapsed, plans: {}, events: {}, zlog: [], projects: [], cards: [] };
    save(); render(); toast('示例已清空，先建一个项目或任务吧');
  }

  ['cardOverlay', 'projOverlay', 'waitOverlay', 'ioOverlay', 'calOverlay', 'syncOverlay'].forEach(function (id) {
    $(id).addEventListener('click', function (e) {
      if (e.target !== this) return;
      this.hidden = true;
      if (id === 'waitOverlay') pendingWait = null;
      if (id === 'projOverlay' || id === 'calOverlay') { pCur = null; render(); }
    });
  });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    var wasProj = !$('projOverlay').hidden || !$('calOverlay').hidden;
    ['cardOverlay', 'projOverlay', 'waitOverlay', 'ioOverlay', 'calOverlay', 'syncOverlay'].forEach(function (id) { $(id).hidden = true; });
    pendingWait = null; if (wasProj) { pCur = null; render(); }
  });

  if (state.timer && Date.now() >= state.timer.start + state.timer.dur) { finishTimer(true); save(); }
  if (mq) { var onMq = function () { render(); }; if (mq.addEventListener) mq.addEventListener('change', onMq); else if (mq.addListener) mq.addListener(onMq); }
  if (okrBridge()) saveCore();
  render();
  initCloud();
})();
</script>
</body>
</html>
