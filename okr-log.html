<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>OKR 登记</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#f5f5f7; --card:#ffffff; --ink:#1d1d1f; --muted:#86868b; --faint:#aeaeb2;
  --line:#e8e8ed; --line2:#f0f0f3; --accent:#2e9bff; --accent-ink:#0a7fe8; --accent-soft:#e8f3ff; --accent-bg:#f2f8ff;
  --ice:#e8f3ff; --warn:#ff3b30; --warn-ink:#e0261c; --warn-soft:#fff0ef; --on-accent:#ffffff; --seg:rgba(0,0,0,.05); --ring:#d1d1d6; --ok:#2e9bff;
  --me:#a8d3ff; --alert:#ff3b30; --ok-soft:#e8f3ff; --alert-soft:#fff0ef; --shadow:0 0 0 .5px rgba(0,0,0,.04),0 2px 10px rgba(0,0,0,.04);
  --sans:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000000; --card:#1c1c1e; --ink:#f5f5f7; --muted:#98989d; --faint:#636366;
  --line:#2c2c2e; --line2:#232325; --accent:#409cff; --accent-ink:#6cb4ff; --accent-soft:#0f2a47; --accent-bg:#0c2038;
  --ice:#0f2a47; --warn:#ff453a; --warn-ink:#ff6961; --warn-soft:#3a1513; --on-accent:#ffffff; --seg:rgba(255,255,255,.08); --ring:#48484a; --ok:#409cff;
  --me:#2f5f8f; --alert:#ff453a; --ok-soft:#0f2a47; --alert-soft:#3a1513; --shadow:0 0 0 .5px rgba(255,255,255,.06); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --card:#1c1c1e; --ink:#f5f5f7; --muted:#98989d; --faint:#636366;
  --line:#2c2c2e; --line2:#232325; --accent:#409cff; --accent-ink:#6cb4ff; --accent-soft:#0f2a47; --accent-bg:#0c2038;
  --ice:#0f2a47; --warn:#ff453a; --warn-ink:#ff6961; --warn-soft:#3a1513; --on-accent:#ffffff; --seg:rgba(255,255,255,.08); --ring:#48484a; --ok:#409cff;
  --me:#2f5f8f; --alert:#ff453a; --ok-soft:#0f2a47; --alert-soft:#3a1513; --shadow:0 0 0 .5px rgba(255,255,255,.06); color-scheme:dark}
/* 三个工具共用的左上角切换：点名称展开列表 */
.appnav{position:relative;flex:none}
.appnav summary{list-style:none;display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 4px;font-size:20px;font-family:var(--sans);font-weight:700;color:var(--ink);cursor:pointer;border-radius:8px;user-select:none}
.appnav summary::-webkit-details-marker{display:none}
.appnav summary::after{content:"";width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:translateY(-2px) rotate(45deg);transition:transform .15s}
.appnav[open] summary::after{transform:translateY(2px) rotate(-135deg)}
.appnav summary:hover{color:var(--accent)}
.appmenu{position:absolute;left:0;top:calc(100% + 6px);z-index:60;min-width:220px;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(20,30,40,.14);padding:6px;display:flex;flex-direction:column;gap:2px}
.appmenu a{display:flex;flex-direction:column;gap:1px;padding:8px 12px;border-radius:7px;text-decoration:none;color:var(--ink)}
.appmenu a b{font-size:15px}
.appmenu a span{font-size:12px;color:var(--muted)}
.appmenu a:hover{background:var(--accent-soft)}
.appmenu a[aria-current="page"]{background:var(--accent-soft)}
.appmenu a[aria-current="page"] b::after{content:" ✓";color:var(--accent)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.55;-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:640px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}

.top{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top,0px)) 8px 12px;display:flex;flex-direction:column;gap:8px}
.dater{display:flex;align-items:center;justify-content:space-between}
.dater button.nav{width:44px;height:44px;border:none;background:none;font-size:24px;color:var(--accent);border-radius:10px}
.dater button.nav:disabled{color:var(--line);cursor:default}
.dt{display:flex;flex-direction:column;align-items:center;gap:2px}
.dt b{font-size:20px}
.pill{font-size:12px;color:var(--accent-ink);background:var(--accent-bg);padding:1px 10px;border-radius:999px;border:none}
.pill.back{color:var(--warn-ink);background:var(--warn-soft)}
.hintline{font-size:12px;color:var(--muted);text-align:center}
.prog{display:flex;align-items:center;gap:10px;padding:0 8px}
.bar{flex:1;height:8px;background:var(--line2);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .25s}
.prog span{font-size:13px;color:var(--muted);white-space:nowrap}

main{flex:1;padding:16px 16px 48px;display:flex;flex-direction:column;gap:18px}
.oh{display:flex;flex-direction:column;gap:2px}
.oh span{font-size:12px;color:var(--muted)}
.oh b{font-size:16px}
.oprog{display:flex;align-items:center;gap:10px;margin-top:4px}
.oprog .bar{height:6px}
.oprog span{font-size:12px;color:var(--muted);white-space:nowrap}
section{display:flex;flex-direction:column;gap:8px}
section>h2{margin:0;font-size:14px;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:8px 8px 8px 14px;border-top:1px solid var(--line2);min-height:60px}
.item:first-child{border-top:none}
.item .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.item .meta{font-size:11px;color:var(--muted)}
.item .meta.late{color:var(--warn)}
.item .nm{font-size:15px;overflow-wrap:anywhere}
.item.done .nm{color:var(--muted)}
.dots{display:flex;gap:4px;flex:none}
.dot{width:44px;height:44px;border:none;background:none;display:flex;align-items:center;justify-content:center;padding:0;border-radius:50%}
.dot i{display:block;width:28px;height:28px;border-radius:50%;border:2px solid var(--ring);transition:transform .15s}
.dot.on i{background:var(--accent);border-color:var(--accent)}
.dot:active i{transform:scale(.88)}
.dots.multi .dot{width:34px}
.dots.multi .dot i{width:22px;height:22px}
.empty{padding:14px;font-size:14px;color:var(--muted)}
.review{background:var(--accent-bg);border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:10px}
.review .t{flex:1;font-size:13px;line-height:1.5}
.review .t span{color:var(--muted)}
.btn{min-height:44px;padding:0 14px;border:1px solid var(--accent);border-radius:8px;background:var(--card);color:var(--accent-ink);font-size:13px;flex:none}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:700;font-size:15px;width:100%;min-height:50px}
.nomore{text-align:center;font-size:13px;color:var(--muted);padding:8px}
.blank{display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center;padding:48px 16px;color:var(--muted)}
.blank a{color:var(--accent-ink)}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));height:60px}
nav.tabs a{display:flex;align-items:center;justify-content:center;text-decoration:none;color:var(--muted);font-size:14px}
nav.tabs a.cur{color:var(--accent);font-weight:700;box-shadow:inset 0 3px 0 var(--accent)}

/* 周回顾抽屉 */
.sheet-bg{position:fixed;inset:0;background:rgba(10,25,40,.4);z-index:50}
.sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(640px,100%);max-height:88vh;overflow:auto;z-index:51;background:var(--card);border-radius:18px 18px 0 0;padding:0 16px calc(16px + env(safe-area-inset-bottom,0px))}
.sh{position:sticky;top:0;background:var(--card);display:flex;align-items:center;padding:14px 0 10px;border-bottom:1px solid var(--line);z-index:2}
.sh b{font-size:17px;flex:1}
.x{width:40px;height:40px;border:none;background:none;font-size:22px;color:var(--faint);border-radius:8px}
.kr{display:flex;flex-direction:column;gap:8px;padding:14px 0;border-bottom:1px solid var(--line2)}
.kr .hd{display:flex;align-items:center;gap:8px}
.tag{font-size:11px;font-weight:700;color:var(--accent-ink);background:var(--accent-soft);padding:2px 8px;border-radius:999px;white-space:nowrap}
.lab{font-size:12px;color:var(--muted)}
.field{width:100%;height:40px;border:1px solid var(--line);border-radius:8px;background:var(--card);padding:0 10px;font-size:15px;min-width:0}
.vrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center}
.conf{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:3px}
.conf button{height:34px;border:1px solid var(--line);border-radius:6px;background:var(--card);font-size:12px;padding:0}
.conf button.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:60;max-width:min(92vw,480px);background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 16px;font-size:14px}

/* 打卡 / 进度 切换 */
.navrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 8px 2px}
.vseg{display:inline-grid;grid-template-columns:repeat(2,auto);background:var(--seg);border-radius:9px;padding:3px;flex:none}
.vseg button{border:none;background:none;min-height:32px;padding:0 14px;border-radius:6px;font-size:14px;color:var(--muted)}
.vseg button.on{background:var(--card);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08)}
/* 进度视图 */
.sp{flex:1}.pad{padding:12px 14px}.sub{font-size:12px;color:var(--muted)}
.row2{display:flex;align-items:center;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{min-height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13px;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chips button.on{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:700}
.krgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.krc{padding:12px 14px;gap:8px}
.krc .kt{flex:1;min-width:0;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap;background:var(--accent-soft);color:var(--accent-ink)}
.st.warn{background:var(--warn-soft);color:var(--warn-ink)}
.st.bad{background:var(--warn);color:var(--on-accent)}
.st.na{background:var(--line2);color:var(--muted)}
.kv b{font-size:24px}.kv span{color:var(--muted);font-size:13px}
.kbar{position:relative;height:8px;background:var(--line2);border-radius:4px}
.kbar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.kbar em{position:absolute;top:-4px;width:2px;height:16px;background:var(--ink);margin-left:-1px}
.kfoot{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);gap:8px}
.arow{padding:12px 14px;border-top:1px solid var(--line2);display:flex;flex-direction:column;gap:8px}
.arow:first-child{border-top:none}
.arow .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.arow .meta,.rv .meta{font-size:11px;color:var(--muted)}
.iv{display:flex;flex-direction:column;align-items:flex-end;flex:none}
.iv b{font-size:20px}.iv small{font-size:11px;color:var(--muted)}
.iv.ok b{color:var(--accent)}.iv.warn b{color:var(--warn)}
.pdots{display:flex;flex-wrap:wrap;gap:4px}
.pdots i,.pleg i{display:inline-block;width:10px;height:10px;border-radius:50%;border:1.5px solid var(--ring)}
.pdots i.d,.pleg i.d{background:var(--accent);border-color:var(--accent)}
.pdots i.m,.pleg i.m{border:2px solid var(--warn)}
.pweeks{display:flex;flex-wrap:wrap;gap:3px}
.pweeks i{width:14px;height:14px;border-radius:3px}
.pweeks i.fut{background:none;box-shadow:inset 0 0 0 1px var(--line)}
.pleg{display:flex;flex-wrap:wrap;gap:12px;padding:10px 14px;border-top:1px solid var(--line2);font-size:11px;color:var(--muted)}
.pleg span{display:flex;align-items:center;gap:5px}
.h0{background:var(--line2)}.h1{background:color-mix(in srgb,var(--accent) 25%,var(--card))}.h2{background:color-mix(in srgb,var(--accent) 50%,var(--card))}.h3{background:color-mix(in srgb,var(--accent) 75%,var(--card))}.h4{background:var(--accent)}
.hgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.hgrid.head{margin-bottom:5px}
.hgrid.head span{font-size:11px;color:var(--muted);text-align:center}
.hc{aspect-ratio:1/1;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--ink)}
.hc.h3,.hc.h4{color:var(--on-accent)}
.hc.empty{background:none}
.hc.fut{background:none;box-shadow:inset 0 0 0 1px var(--line);color:var(--faint)}
.hc.today{outline:2px solid var(--ink);outline-offset:1px}
.hleg{display:flex;align-items:center;gap:4px;margin-top:10px;font-size:11px;color:var(--muted)}
.hleg i{width:12px;height:12px;border-radius:3px;display:inline-block}
.mnav{width:36px;height:36px;border:none;background:none;font-size:20px;color:var(--accent);border-radius:8px}
.mnav:disabled{color:var(--line);cursor:default}
.mlab{font-size:13px;white-space:nowrap}
.fold{background:var(--card);border:1px solid var(--line);border-radius:12px}
.fold summary{padding:12px 14px;font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}
.fold summary::-webkit-details-marker{display:none}
.fold summary::after{content:"›";color:var(--muted);font-size:18px;transition:transform .15s}
.fold[open] summary::after{transform:rotate(90deg)}
.fbody{padding:0 14px 14px;display:flex;flex-direction:column;gap:14px}
.tbox{display:flex;flex-direction:column;gap:6px}
.tsvg{width:100%;height:auto;display:block;max-width:560px}
.tsvg .tgt{stroke:var(--ink);stroke-width:1;stroke-dasharray:2 3}
.tsvg .ideal{stroke:var(--faint);stroke-width:1.5;stroke-dasharray:5 4}
.tsvg .now{stroke:var(--ink);stroke-width:1}
.tsvg .act{fill:none;stroke:var(--accent);stroke-width:2.5}
.tsvg .pt{fill:var(--accent)}
.tsvg .tl{font-size:10px;fill:var(--muted)}
.tleg{display:flex;gap:12px;font-size:11px;color:var(--muted)}
.lg{display:inline-block;width:14px;border-top:2px solid;vertical-align:middle;margin-right:4px}
.lg.act{border-color:var(--accent)}.lg.ideal{border-color:var(--faint);border-top-style:dashed}.lg.now{width:0;height:10px;border-top:none;border-left:2px solid var(--ink)}
.rv{display:flex;flex-direction:column;gap:2px;padding-bottom:10px;border-bottom:1px solid var(--line2);font-size:14px}
.ctab{width:100%;border-collapse:collapse;font-size:13px}
.ctab th,.ctab td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line2)}
.ctab th{font-size:12px;color:var(--muted);font-weight:500}

/* ===== 主题：Apple 风 · 天空蓝 ===== */
body{font-family:var(--sans);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;letter-spacing:-.005em}
h1,.appnav summary{font-family:var(--sans)!important;font-size:24px;font-weight:700;letter-spacing:-.02em}
h2,h3{font-family:var(--sans)!important;font-weight:600;letter-spacing:-.01em}
.card,.fold{border:none;border-radius:18px;box-shadow:var(--shadow)}
.appmenu{border:none;border-radius:14px;box-shadow:0 0 0 .5px rgba(0,0,0,.06),0 12px 32px rgba(0,0,0,.12)}
.field,.osel{border-radius:10px;border-color:transparent;background:rgba(0,0,0,.04)}
.field:focus,.osel:focus{outline:none;background:var(--card);border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.primary{border-radius:980px;font-weight:600}
.newo{border:none;border-radius:980px;background:rgba(0,0,0,.05);font-weight:500}
[hidden]{display:none!important}
.dot.on i{background:var(--accent);border-color:var(--accent)}
.vseg{border-radius:10px;background:var(--seg);padding:2px}
.vseg button{border-radius:8px;font-weight:500}
.vseg button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.chips button{border:none;background:rgba(0,0,0,.05);font-weight:500;border-radius:980px}
.chips button.on{background:var(--ink);color:var(--card)}
.conf button{border-radius:8px}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="navrow"><details class="appnav"><summary aria-label="切换工具，当前：登记">登记</summary><div class="appmenu"><a href="okr-shatter.html"><b>OKR 碎冰台</b><span>把目标拆成行动计划</span></a><a href="okr-log.html" aria-current="page"><b>登记</b><span>每天打卡、看进度</span></a><a href="index.html"><b>看板</b><span>个人工作看板</span></a></div></details><div class="vseg" role="group" aria-label="视图"><button type="button" data-view="log" class="on" aria-pressed="true">打卡</button><button type="button" data-view="prog" aria-pressed="false">进度</button></div></div>
    <div class="dater" id="dater">
      <button type="button" class="nav" data-act="prev" aria-label="前一天">‹</button>
      <div class="dt"><b id="dtTitle"></b><span id="dtPill"></span></div>
      <button type="button" class="nav" data-act="next" aria-label="后一天" id="nextBtn">›</button>
    </div>
    <div class="hintline" id="hintline">切到前几天点圆，记在那一天</div>
    <div class="prog" id="progrow"><div class="bar"><i id="pbar" style="width:0"></i></div><span id="ptext"></span></div>
  </header>
  <main id="main"></main>
</div>

<script>
/* OKR 云同步：碎冰台计划（okr-plan）和登记记录（okr-log）存进看板用的同一个私密 Gist。
   密钥沿用看板“同步”里连接过的那个（同一浏览器、同一网址下自动共用）。哪边更新就用哪边；空数据永远不会覆盖有内容的数据。 */
window.OkrSync = (function () {
  var CFG = 'personal-kanban-gist', GH = 'https://api.github.com';
  var KEYS = ['okr-plan', 'okr-log'], FILE = { 'okr-plan': 'okr-plan.json', 'okr-log': 'okr-log.json' };
  function cfg() { try { var c = JSON.parse(localStorage.getItem(CFG) || 'null'); return c && c.token && c.id ? c : null; } catch (e) { return null; } }
  function rd(k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } }
  function empty(k, o) {
    if (!o || typeof o !== 'object') return true;
    if (k === 'okr-plan') return !((o.objectives || []).some(function (x) { return x.title && String(x.title).trim(); }) || (o.krs || []).length || (o.actions || []).length);
    return !((o.checks || []).length || (o.reviews || []).length);
  }
  function ts(o) { return o && o.updatedAt ? (Date.parse(o.updatedAt) || 0) : 0; }
  function gh(c, path, opt) {
    opt = opt || {};
    return fetch(GH + path, { method: opt.method || 'GET', cache: 'no-store',
      headers: { 'Accept': 'application/vnd.github+json', 'Authorization': 'Bearer ' + c.token, 'X-GitHub-Api-Version': '2022-11-28', 'Content-Type': 'application/json' },
      body: opt.body ? JSON.stringify(opt.body) : undefined
    }).then(function (r) { if (!r.ok) { var e = new Error('GitHub ' + r.status); e.status = r.status; throw e; } return r.json(); });
  }
  function fileData(f) {
    if (!f) return Promise.resolve(null);
    var p = f.truncated ? fetch(f.raw_url, { cache: 'no-store' }).then(function (r) { return r.text(); }) : Promise.resolve(f.content);
    return p.then(function (t) { try { return JSON.parse(t); } catch (e) { return null; } });
  }
  var busy = null, again = false, timer = null, status = 'local';
  function setStatus(s) { status = s; try { window.dispatchEvent(new CustomEvent('okrsync-status', { detail: s })); } catch (e) {} }
  /* 拉取 + 合并 + 把本机更新的部分推上去；返回本机被更新的 key 列表 */
  function sync() {
    var c = cfg(); if (!c) { setStatus('local'); return Promise.resolve([]); }
    if (busy) { again = true; return busy; }
    setStatus('syncing');
    busy = gh(c, '/gists/' + c.id).then(function (g) {
      var files = (g && g.files) || {};
      return Promise.all(KEYS.map(function (k) { return fileData(files[FILE[k]]); })).then(function (remotes) {
        var changed = [], up = {};
        KEYS.forEach(function (k, i) {
          var r = remotes[i], l = rd(k), re = empty(k, r), le = empty(k, l);
          if (!re && (le || ts(r) > ts(l))) { localStorage.setItem(k, JSON.stringify(r)); changed.push(k); }
          else if (!le && (re || ts(l) > ts(r))) { if (!l.updatedAt) l.updatedAt = new Date().toISOString(); up[FILE[k]] = { content: JSON.stringify(l) }; }
        });
        var p = Object.keys(up).length ? gh(c, '/gists/' + c.id, { method: 'PATCH', body: { files: up } }) : Promise.resolve();
        return p.then(function () { return changed; });
      });
    }).then(function (changed) {
      setStatus('ok');
      if (changed.length) try { window.dispatchEvent(new CustomEvent('okrsync', { detail: changed })); } catch (e) {}
      return changed;
    }, function (e) { setStatus('error'); return []; }).then(function (changed) {
      busy = null;
      if (again) { again = false; setTimeout(sync, 300); }
      return changed;
    });
    return busy;
  }
  function queue() { if (!cfg()) return; clearTimeout(timer); timer = setTimeout(sync, 1500); }
  function start() {
    if (!cfg()) return;
    sync();
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') sync(); });
    setInterval(function () { if (document.visibilityState === 'visible') sync(); }, 60000);
  }
  return { sync: sync, queue: queue, start: start, connected: function () { return !!cfg(); }, status: function () { return status; } };
})();
</script>
<script>
document.addEventListener('click',function(e){document.querySelectorAll('details.appnav[open]').forEach(function(d){if(!d.contains(e.target))d.removeAttribute('open')})});
document.addEventListener('keydown',function(e){if(e.key==='Escape')document.querySelectorAll('details.appnav[open]').forEach(function(d){d.removeAttribute('open')})});
/* 读 okr-plan（碎冰台写），写 okr-log：
   checks[{id,actionId,stepId?,date,src}]   reviews[{id,krId,date,value,confidence,note}] */
const PK='okr-plan', LK='okr-log';
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const load=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};
const store=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function parse(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function addDays(s,n){const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)}
function diffDays(a,b){return Math.round((parse(b)-parse(a))/864e5)}
function md(s){const d=parse(s);return (d.getMonth()+1)+'/'+d.getDate()}
const WK='日一二三四五六';
function weekStart(s){const d=parse(s);const k=(d.getDay()+6)%7;d.setDate(d.getDate()-k);return ymd(d)}
const today=()=>ymd(new Date());

let P=load(PK)||{objectives:[],krs:[],actions:[]};
let L=load(LK)||{}; if(!Array.isArray(L.checks))L.checks=[]; if(!Array.isArray(L.reviews))L.reviews=[];
let D=today();
const save=()=>{L.updatedAt=new Date().toISOString();store(LK,L);OkrSync.queue()};

/* 清掉找不到对应行动的打卡记录（碎冰台里删除了的） */
(function cleanup(){
  const acts=new Map(P.actions.map(a=>[a.id,a]));
  const krIds=new Set(P.krs.map(k=>k.id));
  const before=L.checks.length+L.reviews.length;
  L.checks=L.checks.filter(c=>{const a=acts.get(c.actionId);if(!a)return false;if(c.stepId)return a.type==='steps'&&a.steps.some(s=>s.id===c.stepId);return true});
  L.reviews=L.reviews.filter(r=>krIds.has(r.krId));
  if(L.checks.length+L.reviews.length!==before)save();
})();

const krOf=id=>P.krs.find(k=>k.id===id);
const krIndex=k=>P.krs.filter(x=>x.oId===k.oId).indexOf(k)+1;
const activeOs=()=>P.objectives.filter(o=>!o.end||o.end>=today());

/* 某天要显示的事项 */
function itemsFor(o,date){
  const krs=P.krs.filter(k=>k.oId===o.id);const kIds=new Set(krs.map(k=>k.id));
  const acts=P.actions.filter(a=>kIds.has(a.krId)&&(a.name||'').trim());
  const daily=[],steps=[];
  acts.forEach(a=>{
    const kr=krOf(a.krId);
    if(a.type==='repeat'){
      if(!a.start||!a.end||date<a.start||date>a.end)return;
      daily.push({a,kr});
    }else{
      const live=a.steps.filter(s=>!s.drop&&(s.name||'').trim());
      const doneMap=new Map(L.checks.filter(c=>c.actionId===a.id&&c.stepId).map(c=>[c.stepId,c]));
      let undatedShown=false;
      live.forEach(s=>{
        const ck=doneMap.get(s.id);
        if(ck){ if(ck.date===date)steps.push({a,kr,s,ck}); return }
        if(!s.date){ if(!undatedShown){undatedShown=true;steps.push({a,kr,s})} return }
        if(diffDays(date,s.date)<=7)steps.push({a,kr,s});   // 已过期的 + 未来 7 天内的
      });
    }
  });
  steps.sort((x,y)=>(x.s.date||'9999').localeCompare(y.s.date||'9999'));
  return {daily,steps};
}
function daysIncl(a,b){if(!a||!b)return 0;const n=diffDays(a,b)+1;return n>0?n:0}
function planned(a){if(a.type==='steps')return a.steps.filter(x=>!x.drop&&(x.name||'').trim()).length;const d=daysIncl(a.start,a.end),t=Math.max(1,+a.times||1);if(!d)return 0;return a.every==='week'?Math.max(1,Math.round(d/7))*t:d*t}
function doneAll(a){return L.checks.filter(c=>c.actionId===a.id&&(a.type==='steps'?!!c.stepId:!c.stepId)).length}
function oProgress(o){const kIds=new Set(P.krs.filter(k=>k.oId===o.id).map(k=>k.id));let d=0,t=0;P.actions.filter(a=>kIds.has(a.krId)&&(a.name||'').trim()).forEach(a=>{const n=planned(a);t+=n;d+=Math.min(doneAll(a),n)});return {d,t}}
function dayChecks(aid,date){return L.checks.filter(c=>c.actionId===aid&&!c.stepId&&c.date===date)}
function weekChecks(aid,date){const ws=weekStart(date),we=addDays(ws,6);return L.checks.filter(c=>c.actionId===aid&&!c.stepId&&c.date>=ws&&c.date<=we)}

/* ================= 渲染 ================= */
/* ================= 进度视图（监控） ================= */
let V=location.hash==='#progress'?'prog':'log',PO=null,HK='all',HM=null;
function setView(v){V=v;try{history.replaceState(null,'',v==='prog'?'#progress':location.pathname+location.search)}catch(e){}
  document.querySelectorAll('.vseg button').forEach(b=>{const on=b.dataset.view===v;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on)});
  ['dater','hintline','progrow'].forEach(id=>{const el=document.getElementById(id);if(el)el.hidden=v==='prog'});
  render();window.scrollTo({top:0})}
function elapsedFrac(a,b){const tot=daysIncl(a,b);if(!tot)return 0;const t=today();if(t<a)return 0;return Math.min(tot,daysIncl(a,t))/tot}
function expectedOf(a,o){
  const t=today();
  if(a.type==='steps'){const live=a.steps.filter(x=>!x.drop&&(x.name||'').trim());const und=live.filter(x=>!x.date).length;
    return live.filter(x=>x.date&&x.date<=t).length+Math.round(und*elapsedFrac(o.start,o.end))}
  if(!a.start||!a.end)return 0;return Math.round(planned(a)*elapsedFrac(a.start,a.end));
}
function reviewsOf(krId){return L.reviews.filter(r=>r.krId===krId&&r.value!=null).sort((x,y)=>x.date.localeCompare(y.date))}
function krStatus(k,o){
  const rs=reviewsOf(k.id),last=rs[rs.length-1],prev=rs[rs.length-2];
  const tp=elapsedFrac(o.start,k.due||o.end),from=+k.from||0,to=+k.to;
  const conf=last?last.confidence:null;
  const trend=last&&prev&&last.confidence!=null&&prev.confidence!=null?(last.confidence>prev.confidence?'↑':last.confidence<prev.confidence?'↓':'→'):'';
  if(!last||!isFinite(to)||to===from||k.to===''||k.to==null)return {last,tp,pct:null,label:last?'目标未填':'未填现值',cls:'na',conf,trend};
  const pct=Math.max(0,Math.min(1,(last.value-from)/(to-from)));
  let label,cls;
  if(pct>=tp+0.1){label='超前';cls='ok'}else if(pct>=tp){label='正常';cls='ok'}else if(tp-pct<=0.2){label='有风险';cls='warn'}else{label='偏离';cls='bad'}
  if(cls==='ok'&&conf!=null&&conf<=4){label='有风险';cls='warn'}
  return {last,tp,pct,label,cls,conf,trend};
}
function verdict(p){return p==null?['—','']:p>=100?['超前','ok']:p>=80?['接近','']:['落后','warn']}
function dotsOf(a,o){
  const n=planned(a),d=Math.min(doneAll(a),n),e=Math.min(expectedOf(a,o),n);
  if(n<=100){let h='';for(let i=0;i<n;i++)h+=`<i class="${i<d?'d':i<e?'m':''}"></i>`;return `<div class="pdots">${h}</div>`}
  /* 超过 100 次：按周显示，颜色越深这周完成越多 */
  const ws0=weekStart(a.start),weeks=[];for(let w=ws0;w<=a.end;w=addDays(w,7))weeks.push(w);
  const perWeek=a.every==='week'?Math.max(1,+a.times||1):7*Math.max(1,+a.times||1);
  return `<div class="pweeks">${weeks.map(w=>{const c=L.checks.filter(x=>x.actionId===a.id&&!x.stepId&&x.date>=w&&x.date<=addDays(w,6)).length;const lv=c?Math.min(4,Math.ceil(c/perWeek*4)):0;
    return `<i class="h${lv}${w>today()?' fut':''}" title="${md(w)} 起这周：${c} 次"></i>`}).join('')}</div>`;
}
function heatHTML(o,krs,acts){
  const t=today();if(!HM)HM=t.slice(0,7);
  const [y,m]=HM.split('-').map(Number);const first=new Date(y,m-1,1),days=new Date(y,m,0).getDate(),lead=(first.getDay()+6)%7;
  const scope=new Set(acts.filter(a=>HK==='all'||a.krId===HK).map(a=>a.id));
  const cnt={};L.checks.forEach(c=>{if(scope.has(c.actionId))cnt[c.date]=(cnt[c.date]||0)+1});
  const max=Math.max(3,...Object.values(cnt));
  let cells='';for(let i=0;i<lead;i++)cells+='<span class="hc empty"></span>';
  for(let d=1;d<=days;d++){const k=y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');const c=cnt[k]||0;const lv=c?Math.min(4,Math.ceil(c/max*4)):0;
    cells+=`<span class="hc h${lv}${k===t?' today':''}${k>t?' fut':''}" title="${md(k)}：${c} 次">${d}</span>`}
  return `<section><div class="row2"><h2>打卡热力</h2><span class="sp"></span>
    <button type="button" class="mnav" data-hm="-1" aria-label="上个月">‹</button><b class="mlab">${y} 年 ${m} 月</b><button type="button" class="mnav" data-hm="1" aria-label="下个月" ${HM>=t.slice(0,7)?'disabled':''}>›</button></div>
    <div class="chips"><button type="button" class="${HK==='all'?'on':''}" data-hk="all">汇总</button>${krs.map((k,i)=>`<button type="button" class="${HK===k.id?'on':''}" data-hk="${k.id}">KR${i+1}</button>`).join('')}</div>
    <div class="card pad"><div class="hgrid head">${'一二三四五六日'.split('').map(x=>`<span>${x}</span>`).join('')}</div><div class="hgrid">${cells}</div>
    <div class="hleg"><span>少</span><i class="h0"></i><i class="h1"></i><i class="h2"></i><i class="h3"></i><i class="h4"></i><span>多</span></div></div></section>`;
}
function trendSVG(k,o){
  const rs=reviewsOf(k.id),from=+k.from||0,to=+k.to,s=o.start,e=k.due||o.end;
  if(!isFinite(to)||k.to===''||!daysIncl(s,e))return '<div class="sub">补上 KR 的目标数字后显示走势。</div>';
  const W=320,H=140,px=24,py=14,tot=daysIncl(s,e)-1||1,lo=Math.min(from,to,...rs.map(r=>r.value)),hi=Math.max(from,to,...rs.map(r=>r.value)),span=hi-lo||1;
  const X=d=>px+(W-2*px)*Math.max(0,Math.min(1,diffDays(s,d)/tot)),Y=v=>H-py-(H-2*py)*(v-lo)/span;
  const pts=rs.map(r=>[X(r.date),Y(r.value)]);const tx=X(today());
  return `<svg viewBox="0 0 ${W} ${H}" class="tsvg" role="img" aria-label="${esc(k.title)}走势：目标 ${esc(k.to)}，最新 ${rs.length?rs[rs.length-1].value:'未填'}">
    <line x1="${px}" y1="${Y(to)}" x2="${W-px}" y2="${Y(to)}" class="tgt"/><text x="${W-px}" y="${Y(to)-4}" text-anchor="end" class="tl">目标 ${esc(k.to)}</text>
    <line x1="${X(s)}" y1="${Y(from)}" x2="${X(e)}" y2="${Y(to)}" class="ideal"/>
    ${today()>=s&&today()<=e?`<line x1="${tx}" y1="${py-4}" x2="${tx}" y2="${H-py+4}" class="now"/>`:''}
    ${pts.length>1?`<polyline points="${pts.map(p=>p.join(',')).join(' ')}" class="act"/>`:''}
    ${pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" class="pt"/>`).join('')}
    <text x="${px}" y="${H-2}" class="tl">${md(s)}</text><text x="${W-px}" y="${H-2}" text-anchor="end" class="tl">${md(e)}</text></svg>
    <div class="tleg"><span><i class="lg act"></i>实际</span><span><i class="lg ideal"></i>理想轨迹</span><span><i class="lg now"></i>今天</span></div>`;
}
function renderProgress(){
  const main=document.getElementById('main'),os=activeOs();
  if(!os.length){main.innerHTML=`<div class="blank"><span>还没有进行中的目标。</span><a href="okr-shatter.html">去碎冰台 →</a></div>`;return}
  if(!os.find(o=>o.id===PO))PO=os[0].id;const o=os.find(x=>x.id===PO);
  const krs=P.krs.filter(k=>k.oId===o.id);const kIdx=new Map(krs.map((k,i)=>[k.id,i+1]));
  const acts=P.actions.filter(a=>kIdx.has(a.krId)&&(a.name||'').trim()&&planned(a));
  if(HK!=='all'&&!kIdx.has(HK))HK='all';
  const tot=daysIncl(o.start,o.end),el=Math.round(elapsedFrac(o.start,o.end)*tot);
  let h=os.length>1?`<div class="chips">${os.map(x=>`<button type="button" class="${x.id===o.id?'on':''}" data-po="${x.id}">${esc(x.title||'未命名目标')}</button>`).join('')}</div>`:'';
  h+=`<div class="oh"><span>目标 · ${md(o.start)} – ${md(o.end)}</span><b>${esc(o.title||'未命名目标')}</b>
    <div class="oprog"><div class="bar"><i style="width:${tot?Math.round(el/tot*100):0}%;background:var(--ink)"></i></div><span>第 ${el} / ${tot} 天 · 时间已过 ${tot?Math.round(el/tot*100):0}%</span></div></div>`;
  /* KR 总览 */
  h+=`<section><h2>KR 总览</h2><div class="krgrid">${krs.map((k,i)=>{const s=krStatus(k,o);
    return `<div class="card krc"><div class="row2"><span class="tag">KR${i+1}</span><b class="kt">${esc(k.title||'未命名')}</b><span class="st ${s.cls}">${s.label}</span></div>
      <div class="kv"><b>${s.last?s.last.value:'—'}</b><span> / ${esc(k.to===''?'—':k.to)}</span></div>
      <div class="kbar"><i style="width:${s.pct==null?0:Math.round(s.pct*100)}%"></i><em style="left:${Math.round(s.tp*100)}%"></em></div>
      <div class="kfoot"><span>${s.pct==null?'在周回顾里填现值':'完成 '+Math.round(s.pct*100)+'% · 应到 '+Math.round(s.tp*100)+'%'}</span><span>${s.conf!=null?'信心 '+s.conf+' '+s.trend:''}</span></div></div>`}).join('')||'<div class="sub">还没有 KR。</div>'}</div></section>`;
  /* 行动执行 */
  h+=`<section><h2>行动执行</h2><div class="card">${acts.map(a=>{const d=Math.min(doneAll(a),planned(a)),e=expectedOf(a,o),p=e?Math.round(d/e*100):null,[vt,vc]=verdict(p);
    return `<div class="arow"><div class="row2"><span class="t"><span class="meta">KR${kIdx.get(a.krId)} · ${a.type==='steps'?'关键节点':a.every==='week'?'每周 '+(a.times||1)+' 次':'每天'}</span><b>${esc(a.name)}</b></span>
      <span class="iv ${vc}"><b>${p==null?'—':p+'%'}</b><small>强度 · ${vt}</small></span></div>${dotsOf(a,o)}
      <span class="meta">完成 ${d} / 计划 ${planned(a)} · 按时间应完成 ${e}</span></div>`}).join('')||'<div class="empty">还没有行动。</div>'}
    <div class="pleg"><span><i class="d"></i>已完成</span><span><i class="m"></i>该完成还差的</span><span><i></i>剩余计划</span></div></div></section>`;
  /* 热力 */
  h+=heatHTML(o,krs,acts);
  /* 折叠区 */
  h+=`<details class="fold"><summary>指标走势</summary><div class="fbody">${krs.map((k,i)=>`<div class="tbox"><b>KR${i+1} ${esc(k.title||'')}</b>${trendSVG(k,o)}</div>`).join('')}</div></details>`;
  const revs=L.reviews.filter(r=>kIdx.has(r.krId)).sort((x,y)=>y.date.localeCompare(x.date));
  h+=`<details class="fold"><summary>信心与周记</summary><div class="fbody">${revs.length?revs.map(r=>`<div class="rv"><span class="meta">${md(weekStart(r.date))} 这周 · KR${kIdx.get(r.krId)}${r.value!=null?' · 现值 '+r.value:''}${r.confidence!=null?' · 信心 '+r.confidence:''}</span><span>${esc(r.note||'（没写周记）')}</span></div>`).join(''):'<div class="sub">还没有周回顾。在「打卡」页底部填写。</div>'}</div></details>`;
  /* 行动与指标关联：每周打卡次数 vs 指标变化 */
  const weeks=[];for(let w=weekStart(o.start);w<=today();w=addDays(w,7))weeks.push(w);
  const recent=weeks.slice(-8);
  h+=`<details class="fold"><summary>行动与指标关联</summary><div class="fbody">${krs.map((k,i)=>{const ids=new Set(acts.filter(a=>a.krId===k.id).map(a=>a.id));const rs=reviewsOf(k.id);
      const valAt=w=>{const r=rs.filter(x=>x.date<=addDays(w,6)).pop();return r?r.value:null};
      return `<div class="tbox"><b>KR${i+1} ${esc(k.title||'')}</b><table class="ctab"><thead><tr><th>周</th><th>打卡次数</th><th>指标变化</th></tr></thead><tbody>${recent.map((w,j)=>{const c=L.checks.filter(x=>ids.has(x.actionId)&&x.date>=w&&x.date<=addDays(w,6)).length;
        const v=valAt(w),pv=j?valAt(recent[j-1]):(+k.from||0);const dv=v!=null&&pv!=null?v-pv:null;
        return `<tr><td>${md(w)} 起</td><td>${c}</td><td>${dv==null?'—':(dv>0?'+':'')+Math.round(dv*100)/100}</td></tr>`}).join('')}</tbody></table></div>`}).join('')}
    <div class="sub">打卡多的那周指标也涨，说明行动有效；打卡多指标不动，就要考虑换行动。</div></div></details>`;
  main.innerHTML=h;
}

function render(){
  if(V==='prog'){renderProgress();return}
  const t=today(),isToday=D===t;
  document.getElementById('dtTitle').textContent=`${parse(D).getMonth()+1}月${parse(D).getDate()}日 周${WK[parse(D).getDay()]}`;
  document.getElementById('dtPill').innerHTML=isToday?'<span class="pill">今天</span>':`<button type="button" class="pill back" data-act="today">回到今天</button>`;
  document.getElementById('nextBtn').disabled=isToday;
  document.getElementById('hintline').textContent=isToday?'切到前几天点圆，记在那一天':`补打卡：现在点的圆，会记在 ${md(D)}`;

  const os=activeOs();const main=document.getElementById('main');
  if(!P.actions.length){main.innerHTML=`<div class="blank"><b style="color:var(--ink);font-size:16px">还没有行动计划</b><span>先在碎冰台里把目标拆成行动，再回来打卡。</span><a href="okr-shatter.html">去碎冰台 →</a></div>`;setProg(0,0);return}

  let total=0,done=0,h='';
  os.forEach(o=>{
    const {daily,steps}=itemsFor(o,D);if(!daily.length&&!steps.length)return;
    const op=oProgress(o),pct=op.t?Math.round(op.d/op.t*100):0;
    h+=`<div class="oh"><span>目标 · ${o.end?'到 '+md(o.end):''}</span><b>${esc(o.title||'未命名目标')}</b>
      <div class="oprog"><div class="bar"><i style="width:${pct}%"></i></div><span>总进度 ${op.d}/${op.t} · ${pct}%</span></div></div>`;
    if(daily.length){
      h+=`<section><h2>每日</h2><div class="card">${daily.map(({a,kr})=>{
        const times=Math.max(1,+a.times||1);
        let n,label;
        if(a.every==='week'){n=weekChecks(a.id,D).length;label=`KR${krIndex(kr)} · 每周 ${times} 次 · 本周 ${Math.min(n,times)}/${times}`}
        else{n=dayChecks(a.id,D).length;label=`KR${krIndex(kr)}`+(times>1?` · 每天 ${times} 次`:'')}
        label+=` · 累计 ${Math.min(doneAll(a),planned(a))}/${planned(a)}`;
        const filled=Math.min(n,times);
        // 只有今天这一项算进进度：每天型按次数，每周型若本周未满算 1 件
        if(a.every==='week'){const mine=dayChecks(a.id,D).length;if(filled<times||mine){total++;if(mine)done++}}
        else{total+=times;done+=filled}
        return `<div class="item ${filled>=times?'done':''}"><span class="t"><span class="meta">${label}</span><span class="nm">${esc(a.name)}</span></span>
          <span class="dots ${times>1?'multi':''}">${Array.from({length:times},(_,i)=>`<button type="button" class="dot ${i<filled?'on':''}" data-rep="${a.id}" data-i="${i}" aria-label="${esc(a.name)} 第 ${i+1} 次${i<filled?'，已完成':''}" aria-pressed="${i<filled}"><i></i></button>`).join('')}</span></div>`}).join('')}</div></section>`;
    }
    if(steps.length){
      h+=`<section><h2>关键节点</h2><div class="card">${steps.map(({a,kr,s,ck})=>{
        total++;if(ck)done++;
        let when;
        if(!s.date)when='不限日期';
        else{const dd=diffDays(D,s.date);when=md(s.date)+(ck?'':dd<0?` · 已过 ${-dd} 天`:dd===0?' · 就是今天':` · 还有 ${dd} 天`)}
        const late=!ck&&s.date&&s.date<D;
        return `<div class="item ${ck?'done':''}"><span class="t"><span class="meta ${late?'late':''}">KR${krIndex(kr)} · ${esc(a.name)} ${Math.min(doneAll(a),planned(a))}/${planned(a)} · ${when}</span><span class="nm">${esc(s.name)}</span></span>
          <span class="dots"><button type="button" class="dot ${ck?'on':''}" data-step="${a.id}:${s.id}" aria-label="${esc(s.name)}${ck?'，已完成':''}" aria-pressed="${!!ck}"><i></i></button></span></div>`}).join('')}</div></section>`;
    }
  });
  if(!h){
    const later=P.actions.filter(a=>a.type==='repeat'&&a.start&&a.start>D&&os.some(o=>P.krs.some(k=>k.oId===o.id&&k.id===a.krId))).map(a=>a.start).sort()[0];
    h=later?`<div class="blank"><span>这一天还在行动周期开始之前（从 ${md(later)} 开始），所以没有可以打卡的。</span><span>要补打这几天，去碎冰台把目标周期的开始日期往前改。</span><a href="okr-shatter.html">去碎冰台 →</a></div>`
      :`<div class="blank"><span>${D===t?'今天':'这一天'}没有要打卡的行动。</span></div>`;
  }

  // 周回顾入口
  const ws=weekStart(D);const rKrs=os.flatMap(o=>P.krs.filter(k=>k.oId===o.id));
  const doneR=rKrs.filter(k=>L.reviews.some(r=>r.krId===k.id&&r.date>=ws&&r.date<=addDays(ws,6))).length;
  if(rKrs.length)h+=`<div class="review"><span class="t"><b>周回顾</b> · ${doneR===rKrs.length?'本周已填':parse(D).getDay()===0?'今天是周日，填一下吧':'每周日填写'}<br><span>指标现值 + 信心分 + 一句周记</span></span><button type="button" class="btn" data-act="review">${doneR?'修改':'去填写'}</button></div>`;
  main.innerHTML=h;setProg(done,total);
}
function setProg(d,t){document.getElementById('pbar').style.width=(t?Math.round(d/t*100):0)+'%';document.getElementById('ptext').textContent=t?`${D===today()?'今天':md(D)} ${d} / ${t}`:''}

/* ================= 打卡 ================= */
function toggleRep(aid,i){
  const a=P.actions.find(x=>x.id===aid);const times=Math.max(1,+a.times||1);
  const filled=Math.min(a.every==='week'?weekChecks(aid,D).length:dayChecks(aid,D).length,times);
  if(i<filled){ // 取消：只能取消记在这一天的
    const mine=dayChecks(aid,D);
    if(!mine.length){toast('这次打卡记在本周的另一天，切到那天再取消');return}
    const last=mine[mine.length-1];L.checks=L.checks.filter(c=>c.id!==last.id);
  }else{
    if(filled>=times)return;
    L.checks.push({id:uid(),actionId:aid,date:D,src:'log'});
  }
  save();render();
}
function toggleStep(aid,sid){
  const ex=L.checks.find(c=>c.actionId===aid&&c.stepId===sid);
  if(ex){if(ex.date!==D){toast(`这一步已经在 ${md(ex.date)} 打过卡`);return}L.checks=L.checks.filter(c=>c.id!==ex.id)}
  else L.checks.push({id:uid(),actionId:aid,stepId:sid,date:D,src:'log'});
  save();render();
}

/* ================= 周回顾 ================= */
function openReview(){
  const ws=weekStart(D),we=addDays(ws,6);
  const os=activeOs();
  let h=`<div class="sh"><b>周回顾 · ${md(ws)}–${md(we)}</b><button type="button" class="x" data-act="closeR" aria-label="关闭">×</button></div>`;
  os.forEach(o=>{const ks=P.krs.filter(k=>k.oId===o.id);if(!ks.length)return;
    h+=`<div class="lab" style="padding-top:12px">${esc(o.title||'未命名目标')}</div>`;
    ks.forEach((k,i)=>{
      const cur=L.reviews.find(r=>r.krId===k.id&&r.date>=ws&&r.date<=we);
      const last=L.reviews.filter(r=>r.krId===k.id).sort((x,y)=>x.date.localeCompare(y.date)).pop();
      const v=cur?cur.value:(last?last.value:k.from);const cf=cur?cur.confidence:(last?last.confidence:5);
      h+=`<div class="kr" data-kr="${k.id}">
        <div class="hd"><span class="tag">KR${i+1}</span><b style="font-size:15px">${esc(k.title||'未命名')}</b></div>
        <div class="vrow"><label style="display:flex;flex-direction:column;gap:4px"><span class="lab">现值（目标 ${esc(k.to)}）</span><input class="field" inputmode="decimal" data-rv="value" value="${esc(v)}"></label></div>
        <span class="lab">信心分：能按期达成的把握</span>
        <div class="conf" role="group" aria-label="信心分">${Array.from({length:11},(_,n)=>`<button type="button" data-cf="${n}" class="${n===+cf?'on':''}" aria-pressed="${n===+cf}">${n}</button>`).join('')}</div>
        <input class="field" data-rv="note" value="${esc(cur?cur.note:'')}" placeholder="一句周记：这周卡在哪、下周怎么调" aria-label="周记">
      </div>`});
  });
  h+=`<div style="padding-top:14px"><button type="button" class="btn primary" data-act="saveR">保存周回顾</button></div>`;
  const bg=document.createElement('div');bg.className='sheet-bg';bg.id='rbg';bg.addEventListener('click',closeReview);
  const sh=document.createElement('div');sh.className='sheet';sh.id='rsheet';sh.setAttribute('role','dialog');sh.setAttribute('aria-modal','true');sh.setAttribute('aria-label','周回顾');sh.innerHTML=h;
  document.body.append(bg,sh);
}
function closeReview(){document.getElementById('rbg')?.remove();document.getElementById('rsheet')?.remove()}
function saveReview(){
  const ws=weekStart(D),we=addDays(ws,6);
  document.querySelectorAll('#rsheet .kr').forEach(el=>{
    const krId=el.dataset.kr;const value=el.querySelector('[data-rv=value]').value.trim();
    const note=el.querySelector('[data-rv=note]').value.trim();const cf=+(el.querySelector('.conf .on')?.dataset.cf??5);
    let r=L.reviews.find(x=>x.krId===krId&&x.date>=ws&&x.date<=we);
    if(!r){r={id:uid(),krId};L.reviews.push(r)}
    Object.assign(r,{date:D,value:value===''?null:+value,confidence:cf,note});
  });
  save();closeReview();render();toast('周回顾已保存');
}

let tt;function toast(m){document.querySelector('.toast')?.remove();const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=m;document.body.appendChild(t);clearTimeout(tt);tt=setTimeout(()=>t.remove(),3000)}

document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.view){setView(d.view);return}
  if(d.po){PO=d.po;HK='all';render();return}
  if(d.hk){HK=d.hk;render();return}
  if(d.hm){const [y,m]=HM.split('-').map(Number);const nd=new Date(y,m-1+(+d.hm),1);HM=nd.getFullYear()+'-'+String(nd.getMonth()+1).padStart(2,'0');render();return}
  if(d.rep){toggleRep(d.rep,+d.i);return}
  if(d.step){const [a,s]=d.step.split(':');toggleStep(a,s);return}
  if(d.cf!==undefined){b.parentElement.querySelectorAll('button').forEach(x=>{x.classList.toggle('on',x===b);x.setAttribute('aria-pressed',x===b)});return}
  switch(d.act){
    case 'prev':D=addDays(D,-1);render();return;
    case 'next':if(D<today()){D=addDays(D,1);render()}return;
    case 'today':D=today();render();return;
    case 'review':openReview();return;
    case 'closeR':closeReview();return;
    case 'saveR':saveReview();return;
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeReview()});
/* 另一个页面（碎冰台）改了计划，回到这里时刷新 */
window.addEventListener('okrsync',()=>{P=load(PK)||P;L=load(LK)||L;if(!Array.isArray(L.checks))L.checks=[];if(!Array.isArray(L.reviews))L.reviews=[];render()});
OkrSync.start();
window.addEventListener('storage',e=>{if(e.key===PK)P=load(PK)||P;if(e.key===LK)L=load(LK)||L;render()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){P=load(PK)||P;const t=today();if(D>t)D=t;render()}});
setView(V);
</script>
